<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error (500) | SaaS Admin</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS & Icons via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Theme CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="card p-5 text-center shadow-lg border-0" style="max-width: 500px; border-radius: 1.25rem;">
    <div class="mb-3">
      <div class="avatar-circle mx-auto bg-warning-subtle text-warning mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>
      <h1 class="display-3 fw-bold text-danger mb-0">500</h1>
    </div>
    <h3 class="fw-bold text-dark mb-2">Internal Server Error</h3>
    <p class="text-muted mb-4 lead fs-6">
      Something went wrong on our end while processing your request. Our automated diagnostics have been notified.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="/dashboard" class="btn btn-primary px-4 py-2">
        <i class="bi bi-house-door me-2"></i> Dashboard
      </a>
      <a href="javascript:location.reload()" class="btn btn-outline-secondary px-4 py-2">
        <i class="bi bi-arrow-clockwise me-2"></i> Try Again
      </a>
    </div>
  </div>

</body>
</html>
