<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | SaaS Admin Dashboard</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS & Icons via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Theme CSS -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="login-page">

  <div class="login-card p-4 p-sm-5 shadow-lg">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.75rem; border-radius: 12px; background: linear-gradient(135deg, #4e73df 0%, #224abe 100%); display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 4px 15px rgba(78, 115, 223, 0.4);">
        <i class="bi bi-speedometer2"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
      <p class="text-muted small">Sign in to manage your SaaS Admin Dashboard</p>
    </div>

    <!-- Error Alert Display -->
    {% if error %}
    <div class="alert alert-danger d-flex align-items-center mb-4 py-2" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
      <div class="small">{{ error }}</div>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form action="/login" method="POST" id="loginForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token if csrf_token else '' }}">

      <!-- Floating Email Field -->
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
        <label for="email"><i class="bi bi-envelope me-1"></i> Email address</label>
      </div>

      <!-- Floating Password Field -->
      <div class="form-floating mb-4">
        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        <label for="password"><i class="bi bi-shield-lock me-1"></i> Password</label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary w-100 py-3 mb-3 fw-semibold shadow-sm" id="submitBtn">
        <span class="spinner-border spinner-border-sm me-2 d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
        <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
      </button>

      <!-- Demonstration Credentials Hint -->
      <div class="card bg-light border-0 p-3 mb-2">
        <div class="d-flex align-items-center mb-1">
          <i class="bi bi-info-circle text-primary me-2"></i>
          <span class="small fw-semibold text-dark">Demo Access Credentials</span>
        </div>
        <div class="small text-muted font-monospace" style="font-size: 0.8rem;">
          Admin: <code>admin@example.com</code> / <code>Admin123!</code>
        </div>
      </div>
    </form>

    <!-- Footer -->
    <div class="text-center mt-4">
      <p class="text-muted small mb-0">&copy; 2026 SaaS Admin. Built with FastAPI & Bootstrap.</p>
    </div>
  </div>

  <script>
    // Form submission loading state UX
    document.getElementById('loginForm')?.addEventListener('submit', function() {
      const btn = document.getElementById('submitBtn');
      const spinner = document.getElementById('btnSpinner');
      const text = document.getElementById('btnText');
      if (btn && spinner && text) {
        btn.setAttribute('disabled', 'disabled');
        spinner.classList.remove('d-none');
        text.innerText = 'Signing in...';
      }
    });
  </script>
</body>
</html>
