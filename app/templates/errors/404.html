<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | SaaS Admin</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS & Icons via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Theme CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="card p-5 text-center shadow-lg border-0" style="max-width: 500px; border-radius: 1.25rem;">
    <div class="mb-3">
      <div class="avatar-circle mx-auto bg-primary-subtle text-primary mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
        <i class="bi bi-compass"></i>
      </div>
      <h1 class="display-3 fw-bold text-dark mb-0">404</h1>
    </div>
    <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
    <p class="text-muted mb-4 lead fs-6">
      The page or resource you are looking for does not exist, has been removed, or is temporarily unavailable.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="/dashboard" class="btn btn-primary px-4 py-2">
        <i class="bi bi-house-door me-2"></i> Go to Dashboard
      </a>
      <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">
        <i class="bi bi-arrow-left me-2"></i> Back
      </a>
    </div>
  </div>

</body>
</html>
